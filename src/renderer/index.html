<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>A Patra Lume — Nava</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="glass-tv.css" />
  <link rel="stylesheet" href="experience.css" />
</head>
<body data-theme="prologue">
  <div id="stage">
    <!-- z0: film (no audio track; kept muted) -->
    <video id="video" muted playsinline preload="auto" disablepictureinpicture disableremoteplayback></video>

    <!-- z1: theme layers -->
    <div id="vignette" class="layer" aria-hidden="true"></div>
    <div id="white-fade" class="layer" aria-hidden="true"></div>

    <!-- z2: procedural civilisation entities (center) -->
    <canvas id="entities" class="layer" aria-hidden="true"></canvas>

    <!-- z3: countdown (center) -->
    <div id="countdown" class="layer" aria-hidden="true"><svg class="countdown-ring" viewBox="0 0 320 320"><circle class="track" cx="160" cy="160" r="150"/><circle class="progress" cx="160" cy="160" r="150" pathLength="100"/></svg><div class="digit"></div><div class="countdown-label">PREGĂTIȚI DE DECOLARE</div></div>

    <!-- z4: subtitles (bottom-center) -->
    <div id="subtitles" class="layer glass-dark" aria-live="polite">
      <div class="speaker"></div>
      <div class="text"></div>
    </div>

    <!-- z5: 3D avatar (rendered by src/renderer/avatar) -->
    <div id="avatar" class="layer"></div>

    <!-- z6: OSD / diagnostics -->
    <div id="osd" class="layer" hidden>
      <div class="row"><span class="k">ecran</span><span class="v" data-f="screen"></span></div>
      <div class="row"><span class="k">stare</span><span class="v" data-f="state"></span></div>
      <div class="row"><span class="k">timp</span><span class="v" data-f="time"></span></div>
      <div class="row"><span class="k">scenă</span><span class="v" data-f="scene"></span></div>
      <div class="row"><span class="k">sync</span><span class="v" data-f="sync"></span></div>
      <div class="row"><span class="k">video</span><span class="v" data-f="video"></span></div>
      <div class="row"><span class="k">ultimul cue</span><span class="v" data-f="cue"></span></div>
      <div class="row"><span class="k">perf</span><span class="v" data-f="perf"></span></div>
      <div class="note" data-f="note"></div>
    </div>
    <!-- R4 / B-06: visible on every screen while the rate is not 1 -->
    <div id="rehearse" class="layer" hidden></div>
    <div id="identify" class="layer" hidden>
      <div class="id"></div>
      <div class="label"></div>
    </div>
    <div id="spinner" class="layer" hidden><div class="ring"></div></div>
    <div id="error-banner" class="layer" hidden>
      <div class="title"></div>
      <div class="detail"></div>
    </div>

    <!-- z7: visible on the master clock-source screen while the show is idle -->
    <div id="launch-controls" class="layer" hidden>
      <div class="launch-card">
        <svg class="launch-mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M26 42 18 34C22 20 34 10 51 9c-1 17-11 29-25 33Z"/><circle cx="38" cy="22" r="5"/><path d="m20 29-9 3-3 10 16-2m10 0-2 16 10-3 3-9M18 45l-5 6m8-4-3 8M51 48v8m-4-4h8M10 10v6m-3-3h6"/></svg>
        <div class="launch-kicker">EXODUS-7 · SISTEM PREGĂTIT</div>
        <div class="launch-title">A PATRA LUME</div>
        <div class="launch-text">Apasă oriunde sau <kbd>SPACE</kbd> / <kbd>ENTER</kbd> pentru a începe.</div>
        <div class="launch-actions">
          <button id="launch-experience" type="button">PORNEȘTE EXPERIENȚA</button>
          <button id="launch-start" class="secondary" type="button">SARI LA LANSARE</button>
        </div>
        <div class="launch-help"><kbd>S</kbd> start · <kbd>P</kbd> pre-show · <kbd>O</kbd> diagnostic · <kbd>F</kbd> fullscreen</div>
      </div>
    </div>

    <!-- z8: shown only if autoplay is refused -->
    <div id="veil" class="layer" hidden>
      <div class="veil-box">
        <svg class="launch-mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M26 42 18 34C22 20 34 10 51 9c-1 17-11 29-25 33Z"/><circle cx="38" cy="22" r="5"/><path d="m20 29-9 3-3 10 16-2m10 0-2 16 10-3 3-9M18 45l-5 6m8-4-3 8"/></svg>
        <div class="veil-title">A PATRA LUME</div>
        <div class="veil-text">Atinge ecranul sau apasă o tastă.<br />Călătoria noastră poate începe.</div>
      </div>
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
